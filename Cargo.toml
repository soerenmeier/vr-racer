[package]
name = "vr-racer"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = { version = "0.20.0", features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
# Force feedback for racing wheels, through Windows.Gaming.Input.
windows = { version = "0.62.2", features = [
	"Foundation",
	"Foundation_Collections",
	"Foundation_Numerics",
	"Gaming_Input",
	"Gaming_Input_ForceFeedback",
	"Win32_System_WinRT",
] }
windows-numerics = "0.3.1"

[features]
# Faster local builds: `cargo run --features dev`. Never use for release.
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
