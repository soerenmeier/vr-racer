[package]
name = "vr-racer"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = { version = "0.20.0", features = ["jpeg"] }
bevy-inspector-egui = { version = "0.38.0", features = ["documentation"] }
bevy_egui = "0.43.1"
# The Bevy 0.20 port from awtterpip/bevy_oxr#212, pinned. Switch to the
# crates.io release once it is published.
bevy_mod_openxr = { git = "https://github.com/MaximilianHausen/bevy_oxr", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d" }
bevy_mod_xr = { git = "https://github.com/MaximilianHausen/bevy_oxr", rev = "ce6799dbca9d80f2a658d39ad6ac4dc58c2fdc0d" }
openxr = "0.22.0"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Force feedback for racing wheels, through Windows.Gaming.Input.
windows = { version = "0.62.2", features = [
	"Foundation",
	"Foundation_Collections",
	"Foundation_Numerics",
	"Gaming_Input",
	"Gaming_Input_ForceFeedback",
	"Win32_System_WinRT",
] }
windows-numerics = "0.3.1"

[features]
# Faster local builds: `cargo run --features dev`. Never use for release.
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
